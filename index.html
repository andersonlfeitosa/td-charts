<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesouro Direto - Histórico</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">

  <!-- Estilos compartilhados -->
  <link rel="stylesheet" href="css/common.css">

  <!-- Carregamento de bibliotecas externas por CDN -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Biblioteca de suporte a gestos touch (necessária para o pinch zoom no mobile) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <!-- Plugin oficial de Zoom do Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <!-- Módulos JavaScript compartilhados e da página -->
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chart-config.js"></script>
  <script src="js/index.js"></script>
</head>

<body class="pagina-index">
  <div class="nav-header">
    <h1>Histórico de Preços e Taxas do Tesouro Direto</h1>
    <nav class="nav-links">
      <a href="index.html" class="nav-link ativo">Histórico Individual</a>
      <a href="dashboard.html" class="nav-link">Visão Geral (Grid)</a>
    </nav>
  </div>

  <!-- Controles para filtrar o gráfico por Título e Vencimento -->
  <div class="filtros">
    <div class="campo-filtro">
      <label for="selectTitulo">Tipo de Título:</label>
      <select id="selectTitulo"></select>
    </div>

    <div class="campo-filtro">
      <label for="selectVencimento">Data de Vencimento:</label>
      <select id="selectVencimento"></select>
    </div>

    <button id="btnResetZoom">Resetar Zoom</button>
  </div>

  <div class="grafico-container">
    <div class="wrapper-canvas">
      <canvas id="graficoTesouro"></canvas>
    </div>
    <div class="dica-zoom">💡 <b>Dica:</b> No computador, arraste ou use o scroll. No celular ou tablet, faça o gesto de pinça (pinch) sobre o gráfico para aproximar/afastar.</div>
  </div>
</body>

</html>
